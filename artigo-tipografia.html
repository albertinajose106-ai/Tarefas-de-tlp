<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
.capitular::first-letter{font-size:50px; float:left; font-weight:bold; margin-right:6px}
.citacao{border-left:3px solid #ddd; padding-left:12px; margin:16px 0}
.corte{display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.selecao::selection{background:#111; color:#fff}
</style></head><body>
  <h1> Artigo com Tipografia</h1>
<p class="capitular">O bom design começa pelo texto.</p>
<div class="citacao"><strong>Escreve para quem lê.</strong></div>
<p class="corte">Este resumo é muito longo e vai ser cortado na terceira linha automaticamente com reticências sem precisar contar palavras...</p>
<p class="selecao">Seleciona este texto para ver a cor.</p>
</body></html>
