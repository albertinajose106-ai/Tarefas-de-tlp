<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
.gal{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.item{height:150px; background:#ddd; border-radius:12px; overflow:hidden; position:relative; transition:.4s}
.item:hover{transform:scale(1.05)}
.legenda{position:absolute; bottom:0; background:rgba(0,0,0,.7); color:#fff; width:100%; padding:8px; transform:translateY(100%); transition:.3s}
.item:hover .legenda{transform:translateY(0)}
</style></head><body>
  <h1> Galeria com efeito</h1>
<div class="gal">
<div class="item"></div>
<div class="item"><div class="legenda">Foto 2</div></div>
<div class="item"></div>
</div>
</body></html>
