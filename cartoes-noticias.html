<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
.grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; font-family:Arial}
.card{border:1px solid #ddd; border-radius:14px; padding:14px; display:flex; flex-direction:column}
.img{height:100px; background:#ddd; border-radius:8px; margin-bottom:10px}
.card p{flex:1}
</style></head><body>
  <h1>Cartões de notícias</h1>
<div class="grid">
<div class="card"><div class="img"></div><strong>Novo curso de HTML</strong><p>Aprende do zero.</p><button>Ler mais</button></div>
<div class="card"><div class="img"></div><strong>Guia de flexbox</strong><p>Texto mais longo para testar altura igual e botão sempre na base.</p><button>Ler mais</button></div>
</div>
</body></html>
