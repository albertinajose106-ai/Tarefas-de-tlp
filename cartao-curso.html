<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
.curso{max-width:350px; border:1px solid #ddd; border-radius:16px; overflow:hidden; font-family:Arial}
.topo{height:220px; background:linear-gradient(#eee, #999); position:relative; padding:12px}
.selo{background:#fff; padding:4px 12px; border-radius:20px; font-size:12px}
.titulo{position:absolute; bottom:10px; left:12px; color:#fff; font-weight:bold; font-size:20px}
.base{display:flex; justify-content:space-between; padding:12px; align-items:center}
</style></head><body>
  <h1> Cartão de cursos</h1>
<div class="curso">
<div class="topo"><span class="selo">Novo</span><div class="titulo">HTML e CSS do zero</div></div>
<div class="base"><span>12 aulas</span><button>Inscrever</button></div>
</div>
</body></html>
