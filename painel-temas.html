<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
:root{--primaria:#a32020; --borda:#ddd; --radius:14px}
.painel{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; font-family:Arial}
.box{border:1px solid var(--borda); border-radius:var(--radius); padding:16px}
.box strong{color:var(--primaria); font-size:24px}
.full{grid-column:1/4; border:1px solid var(--borda); border-radius:var(--radius); padding:16px}
.btn{background:var(--primaria); color:#fff; border:none; padding:8px 14px; border-radius:8px}
</style></head><body>
  <h1> Painel com temas por variáveis</h1>
<div class="painel">
<div class="box"><strong>1 240</strong><br>Visitas</div>
<div class="box"><strong>86</strong><br>Vendas</div>
<div class="box"><strong>4,8</strong><br>Avaliação</div>
<div class="full"><strong>Relatório do mês</strong><br><button class="btn">Ver detalhes</button></div>
</div>
</body></html>
